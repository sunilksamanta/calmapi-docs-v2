<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/calm-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalmAPI: the backend framework you own</title>
    <meta
      name="description"
      content="CalmAPI 2 is a backend framework for Node.js and MongoDB where every line of framework code lives in your repo: resources, policies, auth, devtools, blocks and an upgrade path."
    />
    <meta property="og:title" content="CalmAPI: the backend framework you own" />
    <meta property="og:type" content="website" />
    <link rel="alternate" type="text/plain" title="llms.txt" href="/llms.txt" />
    <script>
      // Apply the saved theme before the first paint (no light flash in dark mode).
      try {
        var t = localStorage.getItem('theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div class="floating-like-button">
      <div data-lyket-type="clap" data-lyket-id="calmapi-docs"></div>
    </div>

    <script src="https://unpkg.com/@lyket/widget@2.1.0/dist/lyket.js?apiKey=acc0dbccce8e557db5ebbe6d605aaa" defer></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
